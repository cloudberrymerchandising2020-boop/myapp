[project]
name = "myapp"
version = "0.1.0"
description = ""
authors = [
    {name = "Kenneth Chua",email = "cloudberry.merchandising.2020@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<3.16"
dependencies = [
]

[tool.poetry]
packages = [{include = "myapp", from = "src"}]

