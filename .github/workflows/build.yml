name: Build Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: myapp-windows
          - os: ubuntu-latest
            artifact_name: myapp-linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install Tkinter system package (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install project dependencies
        run: poetry install

      - name: Build executable with PyInstaller
        run: poetry run pyinstaller --onefile --windowed --name myapp src/myapp/main.py

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist_release
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp dist/myapp.exe dist_release/${{ matrix.artifact_name }}.exe
          else
            cp dist/myapp dist_release/${{ matrix.artifact_name }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist_release/*
